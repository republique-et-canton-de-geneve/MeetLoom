version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: "06:00"
      timezone: Europe/Zurich
    open-pull-requests-limit: 5
    groups:
      # @vitejs/plugin-react declares a peer on one Vite major: bumped one at a
      # time, npm ci fails with ERESOLVE, so they move together, majors included.
      vite:
        patterns: ["vite", "@vitejs/*"]
        update-types: [major, minor, patch]
      tiptap:
        patterns: ["@tiptap/*"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
        update-types: [minor, patch]
      tooling:
        dependency-type: development
        update-types: [minor, patch]
      runtime:
        dependency-type: production
        update-types: [minor, patch]
    commit-message:
      prefix: "deps"
    ignore:
      # Held on 6.x: typescript-eslint (lint) accepts TypeScript <6.1 only.
      # .github/workflows/typescript7-readiness.yml opens an issue when that
      # changes (https://github.com/typescript-eslint/typescript-eslint/issues/10940).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Types follow the Node.js the server runs (package.json engines,
      # Dockerfile, CI), changed together by hand at the next LTS.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      codeql:
        patterns: ["github/codeql-action*"]
    commit-message:
      prefix: "ci"
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "container"
    ignore:
      # Production runs a Node.js LTS line. A major change also moves
      # package.json engines, CI and @types/node, so it is done by hand when
      # the next even release enters LTS; odd releases never do.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
# Patch updates and development minor updates are auto-merged by
# .github/workflows/dependabot-auto-merge.yml once required checks pass.
